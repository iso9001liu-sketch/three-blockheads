name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure-pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
          static_site_generator: html
      - name: capture diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo "=== tokenlen=${#GH_TOKEN} outcome=${{ steps.pages.outcome }} ==="
            echo "--- GET /pages ---"
            curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/pages 2>&1 || true
            echo "--- GET /permissions/pages ---"
            curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/actions/permissions/pages 2>&1 || true
            echo "--- POST /pages (enable, main) ---"
            curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' 2>&1 || true
            echo "--- GET /pages after POST ---"
            curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/pages 2>&1 || true
          } > _diag.txt
          git config user.email "bot@example.com"
          git config user.name "deploy-bot"
          git add _diag.txt
          git commit -m "chore: deploy diagnostics v3" || true
          git push origin HEAD:main || echo "PUSH_FAILED"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
