<script>
'use strict';
const T = 56, G = 2300, FIX = 1/60;
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
document.getElementById('app').appendChild(canvas);

/* 画布分辨率跟随窗口，避免世界被裁剪出画面 */
let dpr = 1;
function resizeCanvas(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(innerWidth  * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
addEventListener('resize', resizeCanvas);

let AC = null, muted = false;
function sfx(freq, dur, type='square', vol=.07){
  if(muted) return;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
const S = { jump:()=>sfx(420,.12), spring:()=>sfx(880,.25), button:()=>sfx(660,.09),
  clear:()=>sfx(700,.5,'triangle',.14), trap:()=>sfx(120,.5,'sawtooth',.14),
  switchC:()=>sfx(520,.06), land:()=>sfx(180,.06) };

const DEFS = [
  { id:0, name:'蓝方块', color:'#3b5bdb', dark:'#2740a8', light:'#5f7cf0', w:44, h:46,
    jump:-620, maxv:250, acc:2600, fric:2000, weight:3, canPush:true, desc:'重压 · 面瘫 · 推箱子' },
  { id:1, name:'粉团子', color:'#f472b6', dark:'#db2777', light:'#f9a8d4', w:42, h:42,
    jump:-700, maxv:330, acc:3000, fric:500, weight:2, canPush:false, desc:'弹滚 · 刹不住 · 跳得高' },
  { id:2, name:'黄星星', color:'#facc15', dark:'#ca8a04', light:'#fde68a', w:42, h:44,
    jump:-660, maxv:300, acc:2600, fric:1600, weight:1, canPush:false, glide:true, desc:'滑翔 · 太轻 · 飞得远' }

const LEVELS = [

  },

    ],

let world=null, mode='title', levelIdx=0, activeChar=0;
let toasts=[], particle=[];
let shakeT=0, shakeA=0;
let bumpCount=0, blueAngry=false;
let keys={}, time=0;

function tileAt(r,c){ if(!world) return '.'; if(r<0||r>=world.h||c<0||c>=world.w) return '.'; return world.grid[r][c]; }

function parseLevel(def, isInf){
  const rows=def.rows, h=rows.length, w=rows[0].length;
  const grid=rows.map(s=>s.split(''));
  const spawns={}, blocks=[];
  for(let r=0;r<h;r++) for(let c=0;c<w;c++){
    const t=grid[r][c];
    if('123'.includes(t)) spawns[+t]={x:c*T+(T-DEFS[+t-1].w)/2, y:r*T-DEFS[+t-1].h};
    if(t==='K') blocks.push({x:c*T+4, y:r*T-40, w:48, h:40, vy:0, c:c, r:r});
  }
  return { name:def.name, hint:def.hint, grid, h, w, spawns, chars:[], blocks,
    bridges:def.bridges||[], gate:def.gate||null, seesaw:def.seesaw||null,
    isInf:!!isInf };
}
function makeChars(spawns){
  const arr=[];
  for(let i=0;i<3;i++){
    const s=spawns[i+1]||{x:70,y:200};
    arr.push({ id:i, x:s.x, y:s.y, w:DEFS[i].w, h:DEFS[i].h, vx:0, vy:0,
      onGround:false, arrived:false, dead:0, teleCd:0, squash:0, spin:0,
      launched:0, fan:0, happy:0, land:()=>{ S.land(); } });
  }
  return arr;
}
function loadLevel(def, isInf){
  world=parseLevel(def,isInf);
  world.chars=makeChars(world.spawns);
  world.portal=null;
  for(let r=0;r<world.h;r++) for(let c=0;c<world.w;c++){
    if(tileAt(r,c)==='O') world.portal={in:{r,c},out:null};
  }
  if(world.portal) for(let r=0;r<world.h;r++) for(let c=0;c<world.w;c++)
    if(tileAt(r,c)==='C'){ world.portal.out={r,c}; break; }
  activeChar=0; bumpCount=0; blueAngry=false;
  particle=[]; toasts=[]; world.arrivedCnt=0;
  mode='play'; showOverlay('none');
}

function buttonPressed(r,c){
  for(const ch of world.chars){
    if(ch.dead>0) continue;
    if(Math.abs((ch.y+ch.h)-(r*T))<16 && ch.x+ch.w>c*T && ch.x<(c+1)*T && ch.onGround) return true;
  }
  for(const b of world.blocks)
    if(Math.abs((b.y+b.h)-(r*T))<16 && b.x+b.w>c*T && b.x<(c+1)*T) return true;
  return false;
}
function gateOpen(){ const g=world.gate; return g? buttonPressed(g.button[0],g.button[1]) : false; }
function bridgeActive(){ return world.bridges.some(br=>buttonPressed(br.button[0],br.button[1])); }
function isFullSolid(r,c){
  const t=tileAt(r,c);
  return t==='X' || (t==='D' && !gateOpen());
}
function isGround(r,c){
  const t=tileAt(r,c);
  if(t==='='||t==='B'||t==='R'||t==='J'||t==='['||t===']') return true;
  if(t==='|' && bridgeActive()) return true;
  return false;
}
function cellSolidForBlock(r,c){
  const t=tileAt(r,c);
  return t==='X' || (t==='D' && !gateOpen()) || t==='K';
}
function groundTop(r,c){ return r*T; }

function pushBlock(b, dir, px){
  const old=b.x; b.x+=px;
  const rr0=Math.floor(b.y/T), rr1=Math.floor((b.y+b.h-1)/T);
  const cc0=Math.floor(b.x/T), cc1=Math.floor((b.x+b.w-1)/T);
  for(let rr=rr0;rr<=rr1;rr++) for(let cc=cc0;cc<=cc1;cc++){
    if(cellSolidForBlock(rr,cc)){ b.x = dir>0? cc*T-b.w : (cc+1)*T; }
  }
  b.c=Math.round((b.x+b.w/2)/T);
  return Math.abs(b.x-old)>0.01;
}
function updateBlocks(){
  for(const b of world.blocks){
    let sup=false;
    const bot=b.y+b.h, gr=Math.floor(bot/T);
    const c0=Math.floor((b.x+2)/T), c1=Math.floor((b.x+b.w-2)/T);
    for(let cc=c0;cc<=c1;cc++){
      if(isFullSolid(gr,cc) || isGround(gr,cc)){
        const top=gr*T;
        if(bot>=top-4 && bot<=top+6){ b.y=top-b.h; b.vy=0; sup=true; }
      }
    }
    if(!sup){ b.vy+=G*FIX; if(b.vy>900)b.vy=900; b.y+=b.vy*FIX; }
    if(b.y>world.h*T-30){ b.y=world.h*T-30; b.vy=0; }
    b.r=Math.floor((b.y+b.h)/T); b.c=Math.round((b.x+b.w/2)/T);
  }
}

function moveChar(ch, inp){
  const d=DEFS[ch.id];
  let ax=0; if(inp.left)ax-=1; if(inp.right)ax+=1;
  if(ch.onGround){
    if(ax!==0){ ch.vx+=ax*d.acc*FIX; }
    else { const f=d.fric*FIX; if(ch.vx>f)ch.vx-=f; else if(ch.vx<-f)ch.vx+=f; else ch.vx=0; }
    if(Math.abs(ch.vx)>d.maxv)ch.vx=Math.sign(ch.vx)*d.maxv;
  } else {
    ch.vx+=ax*d.acc*0.6*FIX;
    if(Math.abs(ch.vx)>d.maxv*1.05)ch.vx=Math.sign(ch.vx)*d.maxv*1.05;
  }
  if(inp.jump && ch.onGround){ ch.vy=d.jump; ch.onGround=false; ch.squash=-1; S.jump(); }
  if(d.glide && inp.jumpHold && !ch.onGround && ch.vy>90) ch.vy=Math.min(ch.vy,170);

  ch.x += ch.vx*FIX;
  const rr0=Math.floor(ch.y/T), rr1=Math.floor((ch.y+ch.h-0.01)/T);
  const cc0=Math.floor(ch.x/T), cc1=Math.floor((ch.x+ch.w-0.01)/T);
  for(let rr=rr0;rr<=rr1;rr++) for(let cc=cc0;cc<=cc1;cc++){
    if(isFullSolid(rr,cc)){
      if(ch.vx>0){ ch.x=cc*T-ch.w; } else if(ch.vx<0){ ch.x=(cc+1)*T; }
      ch.vx=0;
    }
  }
  if(ch.id===0 && ch.vx!==0){
    const dir=Math.sign(ch.vx);
    for(const b of world.blocks){
      if(ch.y+ch.h>b.y+6 && ch.y<b.y+b.h-6){
        if(dir>0 && ch.x+ch.w>=b.x && ch.x+ch.w-b.x<10){
          if(pushBlock(b,1,ch.vx*FIX)){ ch.x=b.x-ch.w; } else { ch.x=b.x-ch.w; ch.vx=0; }
        } else if(dir<0 && ch.x<=b.x+b.w && b.x+b.w-ch.x<10){
          if(pushBlock(b,-1,ch.vx*FIX)){ ch.x=b.x+b.w; } else { ch.x=b.x+b.w; ch.vx=0; }
        }
      }
    }
  }

  if(!ch.onGround){
    ch.vy+=G*FIX;
    if(d.glide && inp.jumpHold && ch.vy>90) ch.vy+=G*0.4*FIX;
  } else ch.vy=Math.min(ch.vy+G*0.3*FIX,60);

  const prevBottom=ch.y+ch.h;
  ch.y+=ch.vy*FIX;
  ch.onGround=false;

  if(ch.vy>=0){
    const bot=ch.y+ch.h;
    for(let rr=Math.floor(ch.y/T);rr<=Math.floor(bot/T);rr++)
      for(let cc=Math.floor(ch.x/T);cc<=Math.floor((ch.x+ch.w)/T);cc++){
        if(isFullSolid(rr,cc)){
          const top=rr*T;
          if(prevBottom<=top+0.1 && bot>=top){ ch.y=top-ch.h; ch.vy=0; ch.onGround=true; ch.land(); }
        }
      }
    const rows=[Math.floor(bot/T)]; if(bot%T===0&&bot>0) rows.push(Math.floor(bot/T)-1);
    for(const rr of rows) for(let cc=Math.floor((ch.x+4)/T);cc<=Math.floor((ch.x+ch.w-4)/T);cc++){
      if(isGround(rr,cc)){
        const top=groundTop(rr,cc);
        if(prevBottom<=top+0.1 && bot>=top && bot<=top+T){ ch.y=top-ch.h; ch.vy=0; ch.onGround=true; ch.land(); }
      }
    }
  } else {
    for(let rr=Math.floor(ch.y/T);rr<=Math.floor((ch.y+ch.h)/T);rr++)
      for(let cc=Math.floor(ch.x/T);cc<=Math.floor((ch.x+ch.w)/T);cc++){
        if(isFullSolid(rr,cc) && ch.y<=(rr+1)*T && ch.y+ch.h>=rr*T){ ch.y=(rr+1)*T; ch.vy=0; }
      }
  }
  if(ch.y>world.h*T+120) respawn(ch);
}

function respawn(ch){
  const s=world.spawns[ch.id+1]||{x:70,y:100};
  ch.x=s.x; ch.y=s.y; ch.vx=0; ch.vy=0; ch.onGround=false;
  ch.dead=0.8;
  if(ch.arrived && world.arrivedCnt>0) world.arrivedCnt--;
  ch.arrived=false;
  particle.push({x:ch.x+ch.w/2,y:ch.y+ch.h,type:'dust',t:0});
}

function checkExit(ch){
  for(let r=0;r<world.h;r++) for(let c=0;c<world.w;c++){
    if(tileAt(r,c)==='E'){
      const ex=c*T+T/2, ey=r*T+T/2;
      if(Math.abs((ch.x+ch.w/2)-ex)<T*0.75 && Math.abs((ch.y+ch.h)-ey)<T*0.6){
        if(!ch.arrived){ ch.arrived=true; ch.happy=1; world.arrivedCnt++; S.button(); }
        return;
      }
    }
  }
}

function onPad(ch,r,c){
  const pad=r*T;
  return Math.abs(ch.y+ch.h-pad)<20 && ch.x+ch.w>c*T && ch.x<(c+1)*T;
}
function applySeesaw(){
  const sw=world.seesaw; if(!sw) return;
  let lw=0,rw=0;
  for(const ch of world.chars){
    if(ch.dead>0) continue;
    if(onPad(ch,sw.left[0],sw.left[1])) lw+=DEFS[ch.id].weight;
    if(onPad(ch,sw.right[0],sw.right[1])) rw+=DEFS[ch.id].weight;
  }
  const lift=(pad)=>{
    const padX=pad[1]*T;
    for(const ch of world.chars){
      if(ch.dead>0) continue;
      if(ch.x+ch.w>padX && ch.x<padX+T && ch.y+ch.h<pad[0]*T+2.4*T && ch.y+ch.h>pad[0]*T-30){
        ch.vy-=2400*FIX; if(ch.vy<-950)ch.vy=-950; ch.onGround=false; ch.launched=1;
      }
    }
  };
  if(lw>rw) lift(sw.right);
  else if(rw>lw) lift(sw.left);
}
function applyFanSpring(ch){
  for(let r=0;r<world.h;r++) for(let c=0;c<world.w;c++){
    const t=tileAt(r,c);
    if(t==='F'){
      const fx=c*T+T/2;
      if(Math.abs(ch.x+ch.w/2-fx)<T*0.7 && ch.y+ch.h>r*T && ch.y<r*T+T){

      }
    } else if(t==='J'){
      const top=r*T;
      if(Math.abs(ch.y+ch.h-top)<16 && ch.x+ch.w>c*T && ch.x<(c+1)*T && ch.vy>0){
        ch.vy=-DEFS[ch.id].jump*1.7; ch.squash=1; ch.spin=1; S.spring();

function applyPortal(ch){
  const p=world.portal; if(!p||ch.teleCd>0) return;
  const ends=[['in',p.in],['out',p.out]];
  for(const [k,pos] of ends){
    if(!pos) continue;
    if(Math.abs(ch.x+ch.w/2-(pos.c*T+T/2))<T*0.6 && Math.abs(ch.y+ch.h-(pos.r*T))<T*0.8){
      const dst = k==='in'?p.out:p.in; if(!dst) return;
      ch.x=dst.c*T+(T-ch.w)/2; ch.y=dst.r*T-ch.h+2; ch.vx=0; ch.vy=0; ch.teleCd=0.6;
      particle.push({x:ch.x+ch.w/2,y:ch.y+ch.h/2,type:'warp',t:0});
      return;
    }
  }
}
function checkRedButton(){
  for(let r=0;r<world.h;r++) for(let c=0;c<world.w;c++){
    if(tileAt(r,c)==='R' && buttonPressed(r,c)){
      toast('💥 不是所有按钮都应该按！');
      S.trap(); shakeA=10; shakeT=0.5;
      world.chars.forEach(ch=>{ respawn(ch); ch.dead=1.2; });
      return;
    }
  }
}

function step(dt){
  time+=dt; if(shakeT>0)shakeT-=dt;
  const active=world.chars[activeChar];
  const base={ left:keys['ArrowLeft']||keys['a']||keys['A'],
    right:keys['ArrowRight']||keys['d']||keys['D'],
    jump:keys[' ']||keys['ArrowUp']||keys['w']||keys['W'],
    jumpHold:keys[' ']||keys['ArrowUp']||keys['w']||keys['W'] };
  for(const ch of world.chars){
    if(ch.dead>0){ ch.dead-=dt; if(ch.dead<0)ch.dead=0; }
    ch.teleCd-=dt; if(ch.teleCd<0)ch.teleCd=0;
    ch.squash*=0.86; ch.launched=0; ch.fan=0; if(ch.happy>0)ch.happy-=0.02;
    if(ch.dead>0) continue;
    const inp = (ch===active)? base : {left:false,right:false,jump:false,jumpHold:false};
    moveChar(ch,inp);
    applyFanSpring(ch);
    applyPortal(ch);
    checkExit(ch);
  }
  applySeesaw();
  updateBlocks();
  checkRedButton();

  const blue=world.chars[0];
  if(!blue.dead && blue.onGround){
    for(const ch of world.chars){
      if(ch.id!==0 && !ch.dead && ch.vx!==0){
        if(Math.abs(ch.x+ch.w/2-(blue.x+blue.w/2))<(ch.w+blue.w)/2-2 &&
           Math.abs(ch.y+ch.h-(blue.y+blue.h))<14){
          bumpCount++;
          if(!blueAngry && bumpCount>=20){ blueAngry=true; toast('🏆 隐藏成就：他真的生气了！'); S.clear(); }
        }
      }
    }
  }
  if(world.arrivedCnt>=3) finishLevel();
  for(const p of particle)p.t+=dt;
  particle=particle.filter(p=>p.t<0.9);
}
function finishLevel(){
  mode='clear';
  if(world.isInf) wave++;
  document.getElementById('clear-title').textContent = world.isInf?'笨蛋又过一关！':'过关！';
  document.getElementById('clear-info').innerHTML = world.isInf
    ? '无尽模式 已闯过 <b>'+wave+'</b> 关'
    : '『'+world.name+'』完成 · 下一关：第 '+(levelIdx+2)+' 关';
  showOverlay('ov-clear'); S.clear();
}

function fitView(){
  if(!world) return;
  const ww=innerWidth, wh=innerHeight, lw=world.w*T, lh=world.h*T;
  cam.scale=Math.min(ww/lw, wh/lh, 1.7);
  cam.x=(ww-lw*cam.scale)/2; cam.y=(wh-lh*cam.scale)/2;
}
function draw(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fitView();
  const ww=innerWidth,wh=innerHeight;
  const bg=ctx.createLinearGradient(0,0,0,wh);
  bg.addColorStop(0,'#1e293b'); bg.addColorStop(1,'#0b1220');
  ctx.fillStyle=bg; ctx.fillRect(0,0,ww,wh);
  if(!world) return;
  ctx.save();
  if(shakeT>0){ const a=shakeA*shakeT/0.5; ctx.translate((Math.random()*2-1)*a,(Math.random()*2-1)*a); }
  ctx.translate(cam.x,cam.y); ctx.scale(cam.scale,cam.scale);
  drawClouds(ww);
  for(let r=0;r<world.h;r++) for(let c=0;c<world.w;c++) drawTile(r,c);
  for(const b of world.blocks) drawBlock(b);
  for(const ch of world.chars) drawChar(ch);
  drawActiveArrow();
  ctx.restore();
  for(const p of particle) drawParticle(p);
  drawHUD(); drawToasts();
}

function drawStar(ch){

const KEYMAP={'1':0,'2':1,'3':2};
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(mode!=='play') return;
  if(e.key==='q'||e.key==='Q'){ activeChar=(activeChar+2)%3; S.switchC(); e.preventDefault(); }
  else if(e.key==='e'||e.key==='E'){ activeChar=(activeChar+1)%3; S.switchC(); e.preventDefault(); }
  else if(e.key in KEYMAP){ activeChar=KEYMAP[e.key]; S.switchC(); }
  else if(e.key==='r'||e.key==='R'){ restart(); e.preventDefault(); }
  else if(['ArrowLeft','ArrowRight',' ','ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
});
addEventListener('keyup',e=>{ keys[e.key]=false; });
function restart(){ loadLevel(world.isInf? genInfinite():LEVELS[levelIdx], world.isInf); }

function genInfinite(){
  const w=30,h=13,ground=h-2;
  const rows=Array.from({length:h},()=>Array(w).fill('.'));
  for(let c=0;c<w;c++) rows[ground][c]='X';
  let c=6;
  while(c<w-6){
    if(Math.random()<0.55){ const pw=2+((Math.random()*2)|0);
      if(c+pw<w-4){ for(let k=0;k<pw;k++)rows[ground][c+k]='.'; c+=pw+3; } else c+=2; }
    else c+=2+((Math.random()*3)|0);
  }
  rows[ground-1][2]='1'; rows[ground-1][3]='2'; rows[ground-1][4]='3';
  for(let cc=7;cc<w-4;cc++){
    const r=ground-1; if(rows[r][cc]==='X')continue;
    const roll=Math.random();
    if(roll<0.2) rows[r][cc]='J';
    else if(roll<0.32) rows[r][cc]='F';
    else if(roll<0.44) rows[r][cc]='B';
  }
  rows[ground-1][w-2]='E';
  if(Math.random()<0.5){
    const a=Math.floor(8+Math.random()*(w-20)), b=Math.floor(3+Math.random()*(ground-5));
    rows[ground-1][a]='O'; rows[b][Math.min(w-6,a+5)]='C';
  }
  const def={ name:'无尽 · 随机', hint:'想办法让三个都到出口',
    rows:rows.map(r=>r.join('')), bridges:[], gate:null, seesaw:null };
  return def;
}

const overlays=['ov-title','ov-clear','ov-infin'];
function showOverlay(name){
  for(const o of overlays) document.getElementById(o).classList.add('hidden');
  if(name!=='none') document.getElementById(name).classList.remove('hidden');
}
function goMenu(){ mode='title'; showOverlay('ov-title'); }
document.getElementById('btn-campaign').onclick=()=>{ levelIdx=0; loadLevel(LEVELS[0],false); };
document.getElementById('btn-infinite').onclick=()=>{ wave=0; loadLevel(genInfinite(),true); };
document.getElementById('btn-next').onclick=()=>{ levelIdx=(levelIdx+1)%LEVELS.length; loadLevel(LEVELS[levelIdx],false); };
document.getElementById('btn-menu-clear').onclick=goMenu;
document.getElementById('btn-inf-again').onclick=()=>{ wave=0; loadLevel(genInfinite(),true); };
document.getElementById('btn-menu-inf').onclick=goMenu;

function buildTitleIcons(){
  const row=document.getElementById('iprow'); const colors=['#3b5bdb','#f472b6','#facc15'];
  for(let i=0;i<3;i++){
    const d=document.createElement('div'); d.className='ip';
    const cv=document.createElement('canvas'); cv.width=112; cv.height=112;
    const c=cv.getContext('2d'); const cx=56,cy=58;
    if(i===0){ c.fillStyle=colors[0]; c.beginPath(); c.roundRect(28,26,56,58,10); c.fill();
      c.fillStyle='#0b1020'; c.fillRect(38,44,5,7); c.fillRect(58,44,5,7);
      c.strokeStyle='#0b1020'; c.lineWidth=3; c.beginPath(); c.moveTo(40,62); c.lineTo(72,62); c.stroke(); }
    else if(i===1){ c.fillStyle=colors[1]; c.beginPath(); c.arc(cx,cy,30,0,7); c.fill();
      c.fillStyle='#3b0a24'; c.fillRect(40,48,4,5); c.fillRect(68,48,4,5);
      c.strokeStyle='#3b0a24'; c.lineWidth=2.4; c.beginPath(); c.arc(cx,cy+9,6,0,Math.PI); c.stroke(); }
    else { c.fillStyle=colors[2]; c.beginPath();
      for(let k=0;k<10;k++){const rad=k%2?12:30,a=-Math.PI/2+k*Math.PI/5;const px=cx+Math.cos(a)*rad,py=cy+Math.sin(a)*rad;k?c.lineTo(px,py):c.moveTo(px,py);} c.closePath(); c.fill();
      c.strokeStyle='#3b2a00'; c.lineWidth=3;
      c.beginPath(); c.moveTo(40,48); c.lineTo(52,46); c.moveTo(60,46); c.lineTo(72,48); c.moveTo(46,58); c.lineTo(66,58); c.stroke(); }
    d.appendChild(cv); row.appendChild(d);
  }
}

let acc=0,last=performance.now();
function loop(now){
  acc+=Math.min((now-last)/1000,.1); last=now;
  while(acc>=FIX){ if(mode==='play') step(FIX); acc-=FIX; }
  draw(); requestAnimationFrame(loop);
}
buildTitleIcons();
requestAnimationFrame(loop);
</script>
